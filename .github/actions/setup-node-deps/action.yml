name: Setup Node and dependencies
description: >-
  Sets up Node (version from .nvmrc) and restores node_modules from cache, running `npm ci` only
  on a cache miss.

  Why this exists: every job that needs the dependency tree would otherwise
  run a full `npm ci` (~60-90s) on identical work. Keying a node_modules
  cache on the lockfile hash turns that into a ~10s restore.

  History: this was written when six parallel gate jobs each paid that cost.
  The gate has since been consolidated into a single sequential `static` job
  (see quality-gate.yml), because GitHub bills each JOB rounded up to the
  whole minute. The cache still earns its place across the remaining jobs
  (static, test, build, e2e) and across reruns.

inputs:
  prisma:
    description: Also generate the Prisma client (needed for typecheck, tests, build).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        # Read from .nvmrc so CI, the Dockerfile (ARG NODE_VERSION) and local
        # dev cannot drift. A skew is invisible until deploy: CI builds green
        # on its own Node while the image fails on an older one.
        node-version-file: '.nvmrc'
        # Caches the npm download cache, which still helps on a
        # node_modules cache miss.
        cache: 'npm'

    - name: Restore node_modules
      id: node-modules-cache
      uses: actions/cache@v6
      with:
        path: node_modules
        # Exact-hash key with no restore-keys on purpose: a partial restore
        # from a different lockfile would leave a subtly wrong tree, and a
        # wrong dependency tree is worse than a slow install.
        key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --legacy-peer-deps

    # The Prisma client is generated to ./generated/prisma (see
    # prisma/schema.prisma `output`), which is outside node_modules and so is
    # not covered by the cache above. It is fast, so it just re-runs.
    - name: Generate Prisma client
      if: inputs.prisma == 'true'
      shell: bash
      run: npx prisma generate
