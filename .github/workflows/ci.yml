name: CI

# PR-only by design: branch protection marks these checks as required, so a
# PR cannot merge until they all pass — which makes re-running them on the
# post-merge push pure duplicate spend. There is deliberately NO `push`
# trigger; once a PR merges, nothing in this workflow runs again.
#
# ── Cost policy (2026-08-23) ────────────────────────────────────────────────
# Actions minutes were exhausted twice in August. Heavy verification now runs
# LOCALLY on every push via .husky/pre-push (tiered) and `npm run e2e:local`.
# CI keeps only what a local hook cannot honestly replace:
#   PR -> dev              : Static Checks + Build Check          (~5 min)
#   PR -> staging | main   : the above + full unit suite + E2E    (~22 min)
#   any PR with `run-e2e`  : E2E on demand
#   workflow_dispatch      : E2E against any branch
# See CONTRIBUTING.md for the full policy.
on:
  pull_request:
    # main and staging are included so the gate runs on the PRs that promote
    # code into the deploying branches — these are the checks marked as
    # required in branch protection (F-070).
    branches:
      - dev
      - staging
      - main
      - master
    # `labeled` is required for the `run-e2e` opt-in below: adding a label does
    # not re-trigger opened/synchronize, so without it the label would do
    # nothing until the next push.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Cancel redundant runs on the same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Jobs 1-6: the shared fast quality/security gate
  # (lint, format, typecheck, unit tests, npm audit, secret scan).
  # Defined in quality-gate.yml so the deploy workflows can depend on the
  # same checks with `needs:` — see that file's header for why.
  # ──────────────────────────────────────────────
  gate:
    name: Quality Gate
    uses: ./.github/workflows/quality-gate.yml
    with:
      # Verified clean on CI (PR #444: Dependency Audit passed), so the PR path
      # can block on HIGH+ advisories. Deliberately NOT set on the deploy
      # workflows: `npm audit` exits non-zero identically for a real advisory and
      # an unreachable registry, and a registry blip must not block a hotfix.
      strict-audit: true
      # The unit suite runs locally on every push (.husky/pre-push). In CI it
      # runs only on the PRs that promote into a deploying branch, plus the
      # `run-e2e` opt-in. Same expression as the e2e job below — keep in sync.
      full-suite: >-
        ${{ github.event_name == 'workflow_dispatch'
        || github.base_ref == 'staging'
        || github.base_ref == 'main'
        || github.base_ref == 'master'
        || contains(github.event.pull_request.labels.*.name, 'run-e2e') }}

  # ──────────────────────────────────────────────
  # Job 7: Build check (gates on the quality gate)
  # Verifies the app compiles end-to-end. Dummy
  # env vars are used — no real secrets needed here.
  # ──────────────────────────────────────────────
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [gate]
    timeout-minutes: 20
    # Only when e2e is NOT running: the e2e job already does a full
    # `npm run build`, so running both would build the app twice per PR.
    # On dev PRs this is the only thing that catches a build-only failure
    # (bad dynamic import, RSC boundary error) that tsc --noEmit cannot see —
    # the light pre-push tier deliberately does not build.
    if: >-
      ${{ !(github.event_name == 'workflow_dispatch'
      || github.base_ref == 'staging'
      || github.base_ref == 'main'
      || github.base_ref == 'master'
      || contains(github.event.pull_request.labels.*.name, 'run-e2e')) }}
    env:
      # Dummy values sufficient for Next.js compilation.
      # These are NOT production secrets — only used to satisfy module-level
      # env guards during the static page data collection phase of the build.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-build-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: ci-build-secret-not-used-in-production
      # Stripe key must start with sk_test_ or sk_live_ to pass SDK validation
      STRIPE_SECRET_KEY: sk_test_ci_dummy_key_not_real_000000000000
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_not_real
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy_not_real
      # SMTP — email.ts uses || fallbacks so these just prevent undefined warnings
      SMTP_USER: ci@example.com
      SMTP_PASSWORD: ci_dummy_password
      SMTP_HOST: smtp.example.com
      SMTP_PORT: '465'
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps
        with:
          prisma: 'true'

      - name: Build application
        run: npm run build

  # ──────────────────────────────────────────────
  # Job 8: End-to-end tests (Playwright)
  # Spins up Postgres (pgvector — migrations CREATE EXTENSION "vector")
  # and Redis as services, applies migrations, seeds deterministic fixtures
  # (prisma/seed.ts), then runs the e2e suite. BLOCKING: the specs and seed
  # have been hardened for CI, so a failure here fails the PR. The suite bypasses
  # auth rate limiting via E2E_TEST_BYPASS_RATE_LIMIT (double-guarded to non-prod).
  # Deliberately NOT part of quality-gate.yml: at ~30 min it would stall
  # direct-push deploys. It runs here on the PR path instead.
  # ──────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [gate]
    timeout-minutes: 30
    # ~10.5 min per run — the single most expensive job in the repo. It runs
    # on the PRs that promote into a deploying branch, on demand via the
    # `run-e2e` label, or via workflow_dispatch. For every other PR, run it
    # locally: `npm run e2e:local` (CI parity, ~5 min). Keep this expression in
    # sync with the `full-suite` input and the Build Check condition above.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || github.base_ref == 'staging'
      || github.base_ref == 'main'
      || github.base_ref == 'master'
      || contains(github.event.pull_request.labels.*.name, 'run-e2e') }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Real SMTP sink so email-dependent journeys (signup verification, invites)
      # actually deliver — signup fails closed when the verification email can't
      # be sent, so a dummy SMTP host makes the signup happy path untestable.
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025

    env:
      # Playwright's webServer serves the production build (`npm run start -- -p 3005`
      # after the Build step below) — `next dev` route registration proved flaky in CI.
      # These mirror the Build job's dummy values; NEXT_PUBLIC_* are inlined at build
      # time, the rest are read at runtime. NOT secrets.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_test?schema=public
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: ci-build-secret-not-used-in-production
      AUTH_SECRET: ci-build-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3005
      # NextAuth v5 reads AUTH_URL first (NEXTAUTH_URL is the legacy alias);
      # set both so post-login redirects always target the test server port.
      AUTH_URL: http://localhost:3005
      NEXT_PUBLIC_APP_URL: http://localhost:3005
      APP_URL: http://localhost:3005
      STRIPE_SECRET_KEY: sk_test_ci_dummy_key_not_real_000000000000
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_not_real
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy_not_real
      # Point at the MailHog service; the mail transport skips auth/STARTTLS for
      # loopback SMTP hosts (src/lib/email.ts), so plain port 1025 delivers even
      # under the production build.
      SMTP_USER: ci@example.com
      SMTP_PASSWORD: ci_dummy_password
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      # Dummy Microsoft Entra ID credentials so the NextAuth provider registers
      # (ENG-001 verifies the signIn POST fires). NOT real secrets.
      AUTH_MICROSOFT_ENTRA_ID_ID: ci-dummy-client-id
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ci-dummy-client-secret
      AUTH_MICROSOFT_ENTRA_ID_TENANT_ID: ci-dummy-tenant-id
      # Bypass auth rate limiting during e2e (double-guarded to non-production).
      E2E_TEST_BYPASS_RATE_LIMIT: 'true'
      # MinIO storage backend (started via docker run below — the official image
      # needs a `server /data` command, which service containers can't pass).
      # Without it every storage-touching flow (certificate PDF upload on
      # attestation, document uploads) dies with ECONNREFUSED :9000 because GCS
      # is unconfigured in CI and the app falls back to MinIO.
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: lms_minio_ci
      MINIO_SECRET_KEY: lms_minio_secret_ci
      MINIO_BUCKET: lms-documents
      # Dummy, like every other external credential above. ai-client.ts requires
      # this and no longer falls back to a default — that default named the
      # PRODUCTION project, so before it was removed these e2e runs resolved
      # their Vertex calls against production. The calls still fail here (there
      # are no Google credentials on the runner, by design), but they now fail at
      # auth rather than at config, which is the behaviour the AI-degradation
      # specs assert against.
      GOOGLE_PROJECT_ID: ci-dummy-project-not-real

    steps:
      - uses: actions/checkout@v4

      # The app's MinIOProvider auto-creates the bucket on first use; only the
      # server needs to exist. Started first so it is warm long before tests.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            minio/minio:latest server /data

      - uses: ./.github/actions/setup-node-deps
        with:
          prisma: 'true'

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed e2e database
        run: npx prisma db seed

      # Playwright's webServer runs `next start` in CI, so the app must be built
      # first. Runs after migrate/seed so any build-time page evaluation sees a
      # ready database. NEXT_PUBLIC_* values from the job env are inlined here.
      - name: Build app (production)
        run: npm run build

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Wait for MinIO to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf "http://localhost:9000/minio/health/live" && exit 0
            sleep 2
          done
          echo "MinIO did not become ready in time" >&2
          docker logs minio >&2 || true
          exit 1

      - name: Run Playwright e2e tests
        run: npx playwright test tests/e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
