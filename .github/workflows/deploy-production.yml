name: Deploy to Production

on:
  push:
    branches:
      - main
      - master

# Cancel any in-progress deployment for the same branch to avoid race conditions
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # No quality gate here anymore: main is a protected branch whose required
  # status checks (ci.yml's Quality Gate / Build Check / E2E) must pass on the
  # PR BEFORE anything can merge, so re-running them post-merge only paid twice
  # for one answer. Every commit that lands here has already been vetted; this
  # workflow's job is purely build + deploy. (Direct pushes are also rejected
  # by branch protection unless their checks already passed.)
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-ref: ghcr.io/${{ github.repository }}:production-${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=production-latest
            type=sha,prefix=production-,format=long

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.PRODUCTION_NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.PRODUCTION_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production VM
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    # Binds this job to the `production` GitHub environment (F-077).
    #
    # IMPORTANT: this line alone does not gate anything. If the environment
    # does not exist, GitHub creates it on first run with NO protection rules.
    # To make it an actual approval gate, someone with repo admin must set
    # Settings → Environments → production → Required reviewers. Until then
    # this only scopes the deploy and gives it a URL in the run summary.
    environment:
      name: production
      url: https://training.theraptly.com

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENV_FILE_BASE64: ${{ secrets.PRODUCTION_ENV_BASE64 }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,GITHUB_REPO,IMAGE_REF,ENV_FILE_BASE64
          script_stop: true
          script: |
            set -euo pipefail

            # Assuming production is deployed to a separate directory on the VM
            APP_DIR="/home/deploy/apps/lms-production"
            COMPOSE_FILE="${APP_DIR}/docker-compose.production.yml"
            ENV_FILE="${APP_DIR}/.env.production"

            echo "==> Creating .env.production from secret..."
            # tr -d '\r' matches deploy-staging.yml: a secret encoded from a
            # CRLF file yields values with a trailing CR, which compose passes
            # through verbatim — GOOGLE_PROJECT_ID would resolve to a project id
            # ending in CR and fail authentication with no obvious cause.
            # umask before the redirect, not chmod after: `>` creates the file
            # with the shell's umask, so between creation and a later chmod the
            # credentials are briefly world-readable. Setting it here closes
            # that window and also covers the case where the file does not yet
            # exist (a rewrite of an existing file keeps its current mode).
            ( umask 077; echo "$ENV_FILE_BASE64" | base64 --decode | tr -d '\r' > "${ENV_FILE}" )
            # Existing files were created 0664 by earlier deploys — group- and
            # world-readable on a host with other accounts. Correct them once.
            chmod 600 "${ENV_FILE}"

            # GITHUB variables need to be explicitly exported inside the script 
            # if passed via envs block to get interpolated inside strings if needed, 
            # though they are already in the environment.
            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            GITHUB_ACTOR="${{ github.actor }}"
            GITHUB_REPO="${{ github.repository }}"
            IMAGE_REF="${{ needs.build.outputs.image-ref }}"

            echo "==> [1/4] Updating compose config..."
            cd "${APP_DIR}"
            git remote set-url origin "https://x-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
            git fetch origin
            git reset --hard "origin/main"
            git remote set-url origin "https://github.com/${GITHUB_REPO}.git"

            echo "==> [2/4] Pulling production image: ${IMAGE_REF}..."
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            docker pull "${IMAGE_REF}"
            docker tag "${IMAGE_REF}" "ghcr.io/${GITHUB_REPO}:production-latest"


            echo "==> [3/5] Starting data services..."
            # Started first and waited on, so migrations have a healthy database
            # to talk to. Idempotent: these only restart if their config changed.
            APP_IMAGE="${IMAGE_REF}" \
              docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" up -d --wait db redis minio

            echo "==> [4/5] Applying migrations..."
            # Explicit, and BEFORE the app starts. This used to happen inside the
            # app container's entrypoint, which required the app's credential to
            # hold DDL rights and let an unattended restart alter the schema.
            #
            # A failure here stops the deploy with the old app still serving —
            # which is the point: a half-migrated schema behind a new app is a
            # worse outcome than not deploying.
            # `timeout` so a hung migration fails in 5 minutes with a clear exit
            # code instead of consuming the job's 10-minute budget and reporting
            # only "cancelled" — which is how staging run 31814561810 presented,
            # and it took reading the raw log to see the real cause.
            # -T disables TTY allocation, which this non-interactive SSH session
            # cannot provide.
            APP_IMAGE="${IMAGE_REF}" \
              timeout 300 docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" \
              --profile tools run --rm -T migrate

            echo "==> [5/5] Starting application..."
            APP_IMAGE="${IMAGE_REF}" \
              docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" up -d

            echo "==> [4/4] Waiting for health check (port 3000)..."
            for i in $(seq 1 18); do
              if curl -sf http://localhost:3000/api/health > /dev/null; then
                echo "✅ Health check passed."
                break
              fi
              if [ "$i" -eq 18 ]; then
                echo "❌ Health check failed. Check logs:"
                APP_IMAGE="${IMAGE_REF}" docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" logs --tail=50 app
                exit 1
              fi
              sleep 5
            done

            echo "✅ Production deployment complete."
