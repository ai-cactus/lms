name: Deploy to Staging

on:
  push:
    branches:
      - staging
  # Manual trigger — run the staging deploy on demand, independent of the push
  # event (e.g. `gh workflow run deploy-staging.yml --ref staging`). Requires this
  # trigger to be present on the default branch to be dispatchable.
  workflow_dispatch:

# Cancel any in-progress deployment for the same branch to avoid race conditions
concurrency:
  group: deploy-staging
  cancel-in-progress: true

# Required for GITHUB_TOKEN to push to GHCR (GitHub Container Registry)
permissions:
  contents: read
  packages: write

jobs:
  # No quality gate here anymore: staging is a protected branch whose required
  # status checks (ci.yml's Quality Gate / Build Check / E2E) must pass on the
  # PR BEFORE anything can merge, so re-running them post-merge only paid twice
  # for one answer. Every commit that lands here has already been vetted; this
  # workflow's job is purely build + deploy. (Direct pushes are also rejected
  # by branch protection unless their checks already passed.)

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Build the Docker image in CI and push to GHCR
  # This runs on GitHub's own runners — no VM build overhead.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-ref: ghcr.io/${{ github.repository }}:staging-${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is automatically provided by Actions with packages:write permission
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (enables layer caching)
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=staging-latest
            type=sha,prefix=staging-,format=long

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* vars must be baked into the image at build time.
          # Store these as GitHub Actions secrets in the repo settings.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.STAGING_NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.STAGING_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.STAGING_NEXT_PUBLIC_POSTHOG_KEY }}
          # GitHub Actions cache dramatically speeds up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy the pre-built image to the staging VM
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Staging VM
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPO: ${{ github.repository }}
          IMAGE_REF: ${{ needs.build.outputs.image-ref }}
          ENV_FILE_BASE64: ${{ secrets.STAGING_ENV_BASE64 }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,GITHUB_REPO,IMAGE_REF,ENV_FILE_BASE64
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/home/deploy/apps/lms-staging"
            COMPOSE_FILE="${APP_DIR}/docker-compose.staging.yml"
            ENV_FILE="${APP_DIR}/.env.staging"

            echo "==> Creating .env.staging from secret..."
            # umask before the redirect, not chmod after: `>` creates the file
            # with the shell's umask, so between creation and a later chmod the
            # credentials are briefly world-readable. Setting it here closes
            # that window and also covers the case where the file does not yet
            # exist (a rewrite of an existing file keeps its current mode).
            ( umask 077; echo "$ENV_FILE_BASE64" | base64 --decode | tr -d '\r' > "${ENV_FILE}" )
            # Existing files were created 0664 by earlier deploys — group- and
            # world-readable on a host with other accounts. Correct them once.
            chmod 600 "${ENV_FILE}"

            # ── [1/7] Update compose files on the VM ──────────────────────────
            echo "==> [1/7] Pulling latest compose config..."
            cd "${APP_DIR}"
            git remote set-url origin "https://x-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
            git fetch origin
            git reset --hard "origin/staging"
            git remote set-url origin "https://github.com/${GITHUB_REPO}.git"

            # ── [2/7] Reclaim disk before pulling ────────────────────────────
            # Every deploy pulls a new staging-<sha> image and nothing ever removed
            # the old one, so /var/lib/containerd grew until `docker pull` failed
            # with "no space left on device" (run 33612368787, 2026-09-02). This
            # is the second time the VM has filled; the first (2026-08-11) was
            # container logs, fixed by the x-logging caps in the compose files.
            #
            # It matters more than a failed deploy: staging and production share
            # this VM, so a full root disk risks Postgres hitting ENOSPC — the
            # unrecoverable case while there are still no backups.
            #
            # Deliberately narrow, given this repo has twice lost data to an
            # automated sweeper (see the SAFETY block in video-sweep-worker.ts):
            #   - matches only THIS environment's staging-<sha> tags, so the
            #     co-resident environment is untouchable from here;
            #   - keeps the newest KEEP_IMAGES for rollback;
            #   - never matches staging-latest;
            #   - the daemon refuses to delete an image a container is using, so
            #     the running release is protected by docker, not by this list;
            #   - every removal is non-fatal. Reclaiming disk must never be the
            #     reason a deploy stops.
            # Images are re-pullable from GHCR, so the worst case is a slower
            # rollback, not a lost artifact.
            KEEP_IMAGES=3
            echo "==> [2/7] Reclaiming disk (keeping ${KEEP_IMAGES} newest staging images)..."
            df -h / | tail -1
            OLD_IMAGES="$(docker image ls \
              --filter "reference=ghcr.io/${GITHUB_REPO}:staging-*" \
              --format '{{.CreatedAt}}|{{.Repository}}:{{.Tag}}' \
              | grep -v ':staging-latest$' \
              | sort -r \
              | tail -n "+$((KEEP_IMAGES + 1))" \
              | cut -d'|' -f2 || true)"
            if [ -n "${OLD_IMAGES}" ]; then
              echo "${OLD_IMAGES}" | while read -r ref; do
                echo "    removing ${ref}"
                docker image rm "${ref}" || true
              done
            else
              echo "    no superseded staging images to remove"
            fi
            # Dangling layers left behind by the removals above.
            docker image prune -f >/dev/null 2>&1 || true
            df -h / | tail -1

            # ── [3/7] Pull the pre-built image from GHCR ─────────────────────
            echo "==> [3/7] Logging into GHCR and pulling image: ${IMAGE_REF}..."
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            docker pull "${IMAGE_REF}"
            # Also tag as staging-latest for ease of reference
            docker tag "${IMAGE_REF}" "ghcr.io/${GITHUB_REPO}:staging-latest"

            # ── [4/7] Bring up the data services ─────────────────────────────
            # Started first and waited on, so migrations have a healthy database
            # to talk to. Idempotent: these only restart if their config changed.
            echo "==> [4/7] Starting data services..."
            APP_IMAGE="${IMAGE_REF}" \
              docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" up -d --wait db redis minio

            # ── [5/7] Apply database migrations ──────────────────────────────
            # Explicit, and BEFORE the app starts. This used to happen inside the
            # app container's entrypoint, which required the app's credential to
            # hold DDL rights and let an unattended restart alter the schema.
            #
            # A failure here stops the deploy with the old app still serving —
            # which is the point: a half-migrated schema behind a new app is a
            # worse outcome than not deploying.
            echo "==> [5/7] Applying migrations..."
            # `timeout` so a hung migration fails in 5 minutes with a clear exit
            # code instead of consuming the job's 10-minute budget and reporting
            # only "cancelled" — which is how run 31814561810 presented, and it
            # took reading the raw log to see the real cause.
            # -T disables TTY allocation, which this non-interactive SSH session
            # cannot provide.
            APP_IMAGE="${IMAGE_REF}" \
              timeout 300 docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" \
              --profile tools run --rm -T migrate

            # ── [6/7] Start / update the app ─────────────────────────────────
            echo "==> [6/7] Starting application..."
            APP_IMAGE="${IMAGE_REF}" \
              docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" up -d

            # ── [7/7] Verify the app is healthy ──────────────────────────────
            echo "==> [7/7] Waiting for health check (up to 90s)..."
            for i in $(seq 1 18); do
              if curl -sf http://localhost:3001/api/health > /dev/null; then
                echo "✅ Health check passed."
                break
              fi
              if [ "$i" -eq 18 ]; then
                echo "❌ Health check failed after 90s. Check logs:"
                APP_IMAGE="${IMAGE_REF}" docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" logs --tail=50 app
                exit 1
              fi
              sleep 5
            done

            echo ""
            echo "✅ Staging deployment complete. Image: ${IMAGE_REF}"
