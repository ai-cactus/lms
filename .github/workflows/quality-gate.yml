name: Quality Gate

# Reusable quality/security gate (F-070).
#
# Why this exists: GitHub Actions workflows do not block one another. Adding
# `push: main` to ci.yml would run CI *alongside* deploy-production.yml, not
# before it, so a red build would still deploy. Extracting the checks into a
# `workflow_call` workflow lets the deploy workflows depend on them with
# `needs:`, which is a real gate.
#
# Scope: the FAST checks only. The heavy jobs — full production build and the
# Playwright e2e suite — stay in ci.yml on the PR path.
#
# ── Cost note (2026-08-23) ──────────────────────────────────────────────────
# GitHub bills each JOB rounded up to the whole minute. This gate used to be
# six parallel jobs of 0.1-0.9 min each, so ~2.3 min of real work billed as
# ~6 min — every job paid a fresh checkout + node setup + npm ci to do seconds
# of work. They are now a single sequential `static` job (~3 min billed).
# The unit suite stays separate because it must be independently skippable:
# it runs only on PRs that promote into a deploying branch (see `full-suite`).

on:
  workflow_call:
    inputs:
      strict-audit:
        description: >-
          Fail the gate on HIGH+ npm advisories. Defaults to false because
          `npm audit` exits non-zero both for a real advisory and for a
          registry/network error, so a registry blip would block deploys.
        type: boolean
        required: false
        default: false
      full-suite:
        description: >-
          Run the full vitest suite. Defaults to false: the suite runs locally
          on every push via .husky/pre-push, so CI only needs it on the PRs
          that promote code into staging/main. See CONTRIBUTING.md.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  # Pinned deliberately. Resolving "latest" through an unauthenticated
  # api.github.com call hit the rate limit and returned 403 roughly half the
  # time — and because this gate is a dependency of the e2e and build jobs, a
  # 403 here marked them SKIPPED, which drove the pipeline re-runs that
  # exhausted the Actions budget twice. Bump this pin deliberately.
  GITLEAKS_VERSION: '8.30.1'

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-deps
        with:
          prisma: 'true'

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript compiler
        run: npm run typecheck

      # Reads package-lock.json and queries the advisory DB — no install needed.
      # Retried because a transient registry error is indistinguishable from a
      # real advisory by exit code alone.
      - name: Run npm audit (high+)
        continue-on-error: ${{ inputs.strict-audit != true }}
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high; then
              exit 0
            fi
            echo "npm audit attempt ${attempt} failed; retrying in 10s..." >&2
            sleep 10
          done
          echo "npm audit reported advisories or could not reach the registry." >&2
          exit 1

      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Authenticated so the download is not subject to the anonymous rate limit.
          curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # `gitleaks dir` scans files on disk (working tree), so the scan covers
      # committed paths like .claude/agent-memory/** without failing on secrets
      # that only exist in older commits. Full-history scanning runs on the
      # weekly schedule in security-scan.yml (F-075).
      # (`detect --no-git` is the pre-8.19 spelling of this command.)
      - name: Scan working tree for secrets
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose --no-banner

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs locally on every push (.husky/pre-push). CI runs it on the PRs that
    # promote into a deploying branch — see ci.yml's `full-suite` expression.
    if: ${{ inputs.full-suite }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-deps
        with:
          prisma: 'true'

      - name: Run tests
        run: npm run test
