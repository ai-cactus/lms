# docker-compose.production.yml
#
# Manages the full LMS production stack:
#   - app   → Next.js (port 3000, served via Nginx on the host)
#   - db    → PostgreSQL 16 + pgvector (internal network only — no host port)
#   - redis → Redis 7 (internal network only — no host port)
#
# Usage on the VM (after SCPing .env.production):
#   docker compose -f docker-compose.production.yml --env-file .env.production build
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d

name: lms-production

# Bounded container logs (F-074). Without an explicit driver config Docker's
# default json-file driver grows without limit, and every service here writes
# to the same single-disk VM — an unbounded app log can fill the disk and take
# Postgres down with it. 10m x 5 keeps ~50 MB of recent history per service,
# which is enough for local triage; durable retention is Cloud Logging's job
# (see the OTel collector), not the disk's.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  # ── Next.js Application ──────────────────────────────────────────────────────
  app:
    container_name: lms-production-app
    # Image is built in GitHub Actions CI, pushed to GHCR, then pulled here.
    image: ${APP_IMAGE:?APP_IMAGE must be set. Run via the deploy workflow or set manually.}
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Bind to loopback only: traffic must enter via the host nginx reverse proxy
      # (Cloudflare Tunnel -> nginx -> 127.0.0.1:3000), never directly off the VM's
      # public interfaces (which would bypass Cloudflare/WAF and real-IP handling).
      - '127.0.0.1:3000:3000'
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # Stamped onto every structured log line so entries are
      # attributable in Cloud Logging (container paths carry only an id).
      OTEL_SERVICE_NAME: lms-production
      # Presence of this var is what ENABLES tracing (see registerTracing in
      # src/instrumentation.ts). Internal Docker network only.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lms_production}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # MinIO is on the internal Docker network — override the endpoint
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - production-net
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/health 2>/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Two replicas would require a load balancer / docker swarm — keeping at 1
    # for this single-VM setup. Scale horizontally by moving to Cloud Run later.
    deploy:
      resources:
        limits:
          memory: 1g

  # ── PostgreSQL Database ───────────────────────────────────────────────────────
  db:
    container_name: lms-production-db
    # pgvector/pgvector:pg16 is the official pgvector image built on top of
    # postgres:16. It includes the vector extension pre-compiled and ready to
    # activate with: CREATE EXTENSION IF NOT EXISTS vector;
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms_production}
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
    volumes:
      - /home/deploy/data/postgres-production:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms_production}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - production-net

  # ── Redis (for BullMQ job queues) ────────────────────────────────────────────
  redis:
    container_name: lms-production-redis
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.production} --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - /home/deploy/data/redis-production:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - production-net

  # ── MinIO (GCS fallback / local object storage) ───────────────────────────────
  minio:
    container_name: lms-production-minio
    # Pinned (was minio/minio:latest) so redeploys can't silently pull a newer,
    # breaking MinIO. This is a PIN, not an upgrade: before the first deploy that
    # picks this up, ops MUST confirm this tag matches the image already running
    # on the VM and adjust it if not —
    #   docker inspect --format='{{.Image}}' lms-production-minio
    # then map that digest back to its RELEASE tag (docker image ls --digests).
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    logging: *default-logging
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env.production}
    volumes:
      - /home/deploy/data/minio-production:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - production-net

  # ── OpenTelemetry Collector (log shipping) ────────────────────────────────
  # Tails this host's container logs and ships them to Cloud Logging so they
  # survive the container. See infra/otel/collector-config.yaml for why the file
  # tail is used instead of app-side OTLP.
  #
  # Opt-in: with TELEMETRY_ENABLED unset the container still starts but the
  # collector exits unless GOOGLE_PROJECT_ID and the credentials file are
  # present, so a missing key is loud rather than silent.
  otel-collector:
    container_name: lms-production-otel-collector
    image: otel/opentelemetry-collector-contrib:0.114.0
    restart: unless-stopped
    logging: *default-logging
    command: ['--config=/etc/otel/collector-config.yaml']
    environment:
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:?GOOGLE_PROJECT_ID must be set for log shipping}
      # Per-environment service account. NEVER share this key across
      # environments — a staging credential able to write production telemetry
      # repeats the mistake behind two prod data-loss incidents.
      GOOGLE_APPLICATION_CREDENTIALS: /etc/otel/sa-key.json
      OTEL_SERVICE_NAME: lms-production
      OTEL_ENVIRONMENT: production
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otel/collector-config.yaml:ro
      # Hand-placed on the VM, mode 0400, owned by the deploy user. Not in git.
      - /home/deploy/secrets/otel-sa-production.json:/etc/otel/sa-key.json:ro
      # Read-only: the collector reads container logs and must never mutate them.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Host root, read-only, for the hostmetrics scraper (root_path: /hostfs).
      # Needed because a container's own /proc and mounts describe the container,
      # not the VM whose disk actually fills up.
      - /:/hostfs:ro
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - production-net

networks:
  production-net:
    driver: bridge
    name: lms-production-net
